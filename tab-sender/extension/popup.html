<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tab Sender</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">连接中…</span>
    </div>
    <span class="self" id="selfLabel"></span>
  </header>

  <div class="search">
    <input id="filter" type="text" placeholder="搜索对端标签页标题或网址…" autocomplete="off" />
  </div>

  <ul id="tabList" class="tablist"></ul>
  <div id="empty" class="empty" hidden>对端没有打开的标签页</div>

  <section class="settings">
    <div class="set-row">
      <span class="set-label">后台发送</span>
      <button class="keybtn" id="bgKeyBtn" title="点击后按下组合键录制">Alt+Shift</button>
    </div>
    <div class="set-row">
      <span class="set-label">前台置顶</span>
      <button class="keybtn" id="fgKeyBtn" title="点击后按下组合键录制">Alt+Ctrl</button>
    </div>
    <div class="set-hint" id="setHint">点击按钮后按下修饰键组合即可录制。</div>
  </section>

  <footer class="ftr">
    <div class="hint">
      <kbd id="bgHint">Alt+Shift</kbd> 后台 · <kbd id="fgHint">Alt+Ctrl</kbd> 前台
    </div>
    <button id="openSide" class="linkbtn">侧边栏</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
